<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizard Breadcrumb</title>
  <link rel="stylesheet" href="../css/wizard.css">
</head>
<body class="bg-light">
  <main class="container py-8">
    <div class="mb-6">
      <p class="text-sm text-primary font-semibold uppercase tracking-wide">Navigation Aid</p>
      <h1 class="text-4xl">Breadcrumb</h1>
      <p class="paragraph">Clear path indicators for nested page hierarchies.</p>
    </div>

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Library</a></li>
        <li class="breadcrumb-item active" aria-current="page">Data</li>
      </ol>
    </nav>
  </main>
</body>
</html>
