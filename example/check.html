<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizard Checks</title>
    <link rel="stylesheet" href="../css/wizard.css">
</head>
<body>
  <main class="container py-8">
    <div class="mb-6">
      <p class="text-sm text-primary font-semibold uppercase tracking-wide">Form Elements</p>
      <h1 class="text-4xl">Checkbox and Radio</h1>
      <p class="paragraph">Clean form controls with visible focus and clear selection states.</p>
    </div>

    <section class="card">
      <div class="card-body">
        <h2 class="card-title">Selection options</h2>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="checkboxExample" checked>
          <label class="form-check-label" for="checkboxExample">Receive product updates</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="radioExample" id="radio1" checked>
          <label class="form-check-label" for="radio1">Weekly digest</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="radioExample" id="radio2">
          <label class="form-check-label" for="radio2">Monthly digest</label>
        </div>
      </div>
    </section>
  </main>
</body>
</html>

     <div class="container">

                    <input class="form-check-input" type="radio" name="radioExample" id="radio1">

                      Radio 1
                    </label>
                  </div>
                  
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioExample" id="radio2">
                    <label class="form-check-label" for="radio2">
                      Radio 2
                    </label>
                  </div>
                  
        </div>
     </div> 
    
</body>
</html>
