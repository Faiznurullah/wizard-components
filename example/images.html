<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Images</title>
    <link rel="stylesheet" href="../css/wizard.css">
</head>
<body class="bg-light">
    <main class="container py-8">
        <div class="mb-6">
            <p class="text-sm text-primary font-semibold uppercase tracking-wide">Media Helpers</p>
            <h1 class="text-4xl">Images</h1>
            <p class="paragraph">Rounded and circular image treatments for avatars and media blocks.</p>
        </div>

        <section class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-12 col-md-6 mb-4">
                        <img class="img-rounded" alt="Rounded preview" width="100%" height="320" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%233B82F6'/%3E%3Cstop offset='100%25' stop-color='%231F2937'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='800' height='500' fill='url(%23g)'/%3E%3Ccircle cx='640' cy='130' r='90' fill='%23ffffff' fill-opacity='0.15'/%3E%3Crect x='90' y='120' width='320' height='56' rx='18' fill='%23ffffff' fill-opacity='0.18'/%3E%3Crect x='90' y='200' width='250' height='24' rx='12' fill='%23ffffff' fill-opacity='0.22'/%3E%3C/svg%3E">
                    </div>
                    <div class="col-12 col-md-6 mb-4">
                        <img class="img-circle" alt="Circular preview" width="320" height="320" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%23D1FAE5'/%3E%3Cstop offset='100%25' stop-color='%2310B981'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='500' height='500' fill='url(%23g)'/%3E%3Ccircle cx='250' cy='200' r='120' fill='%23ffffff' fill-opacity='0.18'/%3E%3Ccircle cx='250' cy='260' r='165' fill='%23ffffff' fill-opacity='0.12'/%3E%3C/svg%3E">
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
