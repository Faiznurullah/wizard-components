<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizard Pagination</title>
  <link rel="stylesheet" href="../css/wizard.css">
</head>
<body class="bg-light">
  <main class="container py-8">
    <div class="mb-6">
      <p class="text-sm text-primary font-semibold uppercase tracking-wide">Navigation</p>
      <h1 class="text-4xl">Pagination</h1>
      <p class="paragraph">Soft elevated page controls with clear active and disabled states.</p>
    </div>

    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
